<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Produtos</title>
</head>
<body>

<h1>CRUD de Produtos</h1>

<h2>Criar Produto</h2>
<input id="nome" placeholder="Nome">
<input id="preco" placeholder="Preço" type="number">
<input id="estoque" placeholder="Estoque" type="number">
<button onclick="criarProduto()">Criar</button>

<h2>Listar Produtos</h2>
<button onclick="listarProdutos()">Listar</button>
<ul id="lista"></ul>

<h2>Atualizar Produto</h2>
<input id="id_update" placeholder="ID">
<input id="nome_update" placeholder="Nome">
<input id="preco_update" placeholder="Preço" type="number">
<input id="estoque_update" placeholder="Estoque" type="number">
<button onclick="atualizarProduto()">Atualizar</button>

<h2>Deletar Produto</h2>
<input id="id_delete" placeholder="ID">
<button onclick="deletarProduto()">Deletar</button>

<script>
const API = "http://localhost:5001";

function criarProduto() {
    fetch(`${API}/produtos`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nome: document.getElementById("nome").value,
            preco: parseFloat(document.getElementById("preco").value),
            estoque: parseInt(document.getElementById("estoque").value)
        })
    })
    .then(res => res.json())
    .then(data => alert(JSON.stringify(data)));
}

function listarProdutos() {
    fetch(`${API}/produtos`)
    .then(res => res.json())
    .then(produtos => {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        produtos.forEach(p => {
            const li = document.createElement("li");
            li.innerText = `ID: ${p.id} | ${p.nome} | R$ ${p.preco} | Estoque: ${p.estoque}`;
            lista.appendChild(li);
        });
    });
}

function atualizarProduto() {
    const id = document.getElementById("id_update").value;

    fetch(`${API}/produtos/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nome: document.getElementById("nome_update").value,
            preco: parseFloat(document.getElementById("preco_update").value),
            estoque: parseInt(document.getElementById("estoque_update").value)
        })
    })
    .then(res => res.json())
    .then(data => alert(JSON.stringify(data)));
}

function deletarProduto() {
    const id = document.getElementById("id_delete").value;

    fetch(`${API}/produtos/${id}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(data => alert(JSON.stringify(data)));
}
</script>

</body>
</html>
