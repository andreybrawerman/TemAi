<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TemAí? - Meu Perfil</title>
  <link rel="stylesheet" href="../../assets/css/globais.css" />
  <link rel="stylesheet" href="perfil.css" />
  <link rel="icon" type="image/png" href="../../assets/img/logo_carrinho_redondo.png">
</head>
<body>
  <header>
    <button class="hamburger" id="hamburger" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="../home/landingpage.html" class="logo">
      <img src="../../assets/img/logo_temai.png" alt="Logo Temai" />
    </a>

    <nav>
      <a href="../home/landingpage.html">Página Inicial</a>
      <a href="../vendas/testar_vendas.html">Área de Compras</a>

      <a href="../estoque/estoque.html" class="admin-only">Estoque (ADM)</a>
      <a href="../usuario/usuario.html" class="admin-only">Usuários (ADM)</a>
      <a href="../vendas/painel_vendas.html" class="admin-only">Vendas (ADM)</a>

      <a href="perfil.html" class="ativo">Perfil</a>
      <a href="#" onclick="logout()">Sair</a>
    </nav>
  </header>

  <main class="perfil-container">
    <section class="perfil-card">
      <h1>Meu Perfil</h1>

      <div class="foto-area">
        <img id="previewFoto" src="../../assets/img/perfil_padrao.png" alt="Foto de Perfil" class="foto-preview">
        <label for="fotoPerfil" class="btn-foto">Escolher Foto</label>
        <input type="file" id="fotoPerfil" accept="image/*" hidden>
      </div>

      <div class="form-grid">
        <input id="perfil_nome" type="text" placeholder="Nome Completo">
        <input id="perfil_email" type="email" placeholder="E-mail">
        <input id="perfil_cpf" type="text" placeholder="CPF">
        <input id="perfil_cep" type="text" placeholder="CEP">
        <input id="perfil_data" type="date">

        <div class="input-container">
          <input id="perfil_senha_atual" type="password" placeholder="Senha Atual (obrigatória)" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="toggleSenha('perfil_senha_atual', 'eyePerfil1')">
            <img src="../../assets/img/olho.png" alt="Mostrar Senha" id="eyePerfil1">
          </button>
        </div>

        <div class="input-container">
          <input id="perfil_nova_senha" type="password" placeholder="Nova Senha (opcional)">
          <button type="button" class="password-toggle" onclick="toggleSenha('perfil_nova_senha', 'eyePerfil2')">
            <img src="../../assets/img/olho.png" alt="Mostrar Senha" id="eyePerfil2">
          </button>
        </div>

        <div class="input-container">
          <input id="perfil_confirma_senha" type="password" placeholder="Confirmar Nova Senha">
          <button type="button" class="password-toggle" onclick="toggleSenha('perfil_confirma_senha', 'eyePerfil3')">
            <img src="../../assets/img/olho.png" alt="Mostrar Senha" id="eyePerfil3">
          </button>
        </div>
      </div>

      <button id="btnSalvarPerfil" class="btn-salvar">Salvar Alterações</button>
      <p id="perfil_msg" class="feedback"></p>
    </section>
  </main>
  <script src="../../assets/js/auth.js"></script>
  <script>
    verificarLogin();
    controlarMenuAdmin();
  </script>
  <script src="perfil.js"></script>
</body>
</html>
