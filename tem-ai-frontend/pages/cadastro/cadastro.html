<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TemAí?</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

<div class="container">
    <h2>Cadastro</h2>
    <form id="formCadastro">
        
        <div class="form-group">
            <label for="nome" class="required">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Mínimo 5 caracteres" required minlength="5">
        </div>

        <div class="form-group">
            <label for="email" class="required">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="cpf" class="required">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="Apenas números (11 dígitos)" required maxlength="11">
        </div>

        <div class="form-group">
            <label for="data_nascimento" class="required">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>

        <div class="form-group">
            <label for="cep" class="required">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="Apenas números" required maxlength="8">
        </div>

        <div class="form-group">
            <label for="senha" class="required">Senha</label>
            <input type="password" id="senha" name="senha" required>
            <button type="button" class="password-toggle" onclick="toggleSenha('senha')">👁️</button>
        </div>

        <div class="form-group">
            <label for="confirma_senha" class="required">Confirmar Senha</label>
            <input type="password" id="confirma_senha" name="confirma_senha" required>
            <button type="button" class="password-toggle" onclick="toggleSenha('confirma_senha')">👁️</button>
        </div>

        <button type="submit">Cadastrar</button>
        <div id="mensagemBox" class="mensagem"></div>
    </form>
</div>

<script src="cadastro.js"></script>
</body>
</html>
