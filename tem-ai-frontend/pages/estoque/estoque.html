<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tem Ai - Gestão de Estoque</title>
    <link rel="stylesheet" href="estoque.css">
</head>
<body>

    <header class="cabecalho-oficial">
        <h1>Dashboard de Estoque - Tem Ai</h1>
    </header>

    <div class="container">
        <h2>Cadastrar / Editar Produto</h2>
        <form id="formProduto" class="form-group">
            <input type="hidden" id="produtoId">
            <input type="text" id="nome" placeholder="Nome do Produto" required>
            <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" required>
            <input type="number" id="estoque" placeholder="Qtd. em Estoque" required>
            
            <button type="submit" id="btnSalvar" class="btn-principal">Salvar Produto</button>
            <button type="button" id="btnCancelar" class="btn-cancelar" onclick="cancelarEdicao()">Cancelar</button>
        </form>

        <h2>Lista de Produtos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço (R$)</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos">
                </tbody>
        </table>
    </div>

    <script src="estoque.js"></script>
</body>
</html>
