<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TemAi? - Gestão de Estoque</title>
    <link rel="stylesheet" href="../../assets/css/globais.css" />
    <link rel="stylesheet" href="estoque.css" />
    <link rel="icon" type="image/png" href="../../assets/img/logo_carrinho_redondo.png">
  </head>
  <body>
    <header>
      <button class="hamburger" id="hamburger" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a href="../home/landingpage.html" class="logo">
        <img src="../../assets/img/logo_temai.png" alt="Logo Temai" />
      </a>

      <nav>
        <a href="../home/landingpage.html">Página Inicial</a>
        <a href="../vendas/testar_vendas.html">Área de Compras</a>
        <a href="../estoque/estoque.html" class="ativo">Estoque (ADM)</a>
        <a href="../usuario/usuario.html">Usuários (ADM)</a>
        <a href="../perfil/perfil.html">Perfil</a>
        <a href="../login/login.html">Sair</a>
    </nav>
      </nav>
    </header>

    <div class="container">
      <h2>Cadastrar / Editar Produto</h2>
      <form id="formProduto" class="form-group">
        <input type="hidden" id="produtoId" />
        <input type="text" id="nome" placeholder="Nome do Produto" required />
        <input
          type="number"
          id="preco"
          placeholder="Preço (R$)"
          step="0.01"
          required
        />
        <input
          type="number"
          id="estoque"
          placeholder="Qtd. em Estoque"
          required
        />

        <button type="submit" id="btnSalvar" class="btn-principal">
          Salvar Produto
        </button>
        <button
          type="button"
          id="btnCancelar"
          class="btn-cancelar"
          onclick="cancelarEdicao()"
        >
          Cancelar
        </button>
      </form>

      <h2>Lista de Produtos</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço (R$)</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaProdutos"></tbody>
      </table>
    </div>

    <script src="estoque.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
  </body>
</html>
