<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tem Ai - Marketplace</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        section { background: white; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Estilo da Vitrine */
        #vitrine { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .produto-card { border: 1px solid #eee; padding: 15px; border-radius: 8px; width: 200px; text-align: center; background: #fff; }
        .produto-card button { background-color: #28a745; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
        
        /* Estilo da Sacola */
        .sacola-area { border: 2px solid #ffaa00; background: #fffef0; }
        .btn-finalizar { background-color: #ffaa00; color: white; font-weight: bold; padding: 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <h1>🏪 Tem Ai - Área de Compras</h1>

    <h2>Produtos Disponíveis</h2>
    <div id="vitrine">
        <p>Carregando produtos...</p>
    </div>

    <section class="sacola-area">
        <h2>🛒 Minha Sacola</h2>
        <ul id="itens_sacola">
            <li>Nenhum item adicionado.</li>
        </ul>
        <p><strong>Total: R$ <span id="valor_total_sacola">0.00</span></strong></p>
        <button class="btn-finalizar" onclick="finalizarVenda()">FINALIZAR COMPRA</button>
    </section>

    <section>
        <h2>👤 Meus Pedidos</h2>
        <input type="number" id="busca_usuario_id" placeholder="ID do Usuário (Ex: 1)">
        <button onclick="listarPedidosUsuario()">Ver Histórico</button>
        <div id="lista_usuario"></div>
    </section>

    <section>
        <h2>🛠️ Painel ADM (Vendas Realizadas)</h2>
        <button onclick="listarPedidosAdmin()">Atualizar Relatório Geral</button>
        <table>
            <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Data</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabela_adm"></tbody>
        </table>
    </section>

    <script>
        const API = "http://localhost:5001";
        let carrinho = [];
        let totalGeral = 0;
        const idUsuarioLogado = 1; // Simulando usuário Mariana logada

        // Carregar produtos ao abrir a página
        window.onload = function() {
            listarProdutos();
        };

        function listarProdutos() {
            fetch(`${API}/produtos`)
            .then(res => res.json())
            .then(produtos => {
                const vitrine = document.getElementById("vitrine");
                vitrine.innerHTML = "";
                produtos.forEach(p => {
                    vitrine.innerHTML += `
                        <div class="produto-card">
                            <h3>${p.nome}</h3>
                            <p>R$ ${p.preco.toFixed(2)}</p>
                            <p><small>Estoque: ${p.estoque}</small></p>
                            <button onclick="adicionarNaSacola(${p.id}, '${p.nome}', ${p.preco})">
                                Adicionar
                            </button>
                        </div>
                    `;
                });
            });
        }

        function adicionarNaSacola(id, nome, preco) {
            carrinho.push({ id_produto: id, nome: nome, preco: preco });
            atualizarVisualizacaoSacola();
        }

        function atualizarVisualizacaoSacola() {
            const lista = document.getElementById("itens_sacola");
            const totalTxt = document.getElementById("valor_total_sacola");
            lista.innerHTML = "";
            totalGeral = 0;

            if (carrinho.length === 0) {
                lista.innerHTML = "<li>Nenhum item adicionado.</li>";
            } else {
                carrinho.forEach(item => {
                    totalGeral += item.preco;
                    lista.innerHTML += `<li>${item.nome} - R$ ${item.preco.toFixed(2)}</li>`;
                });
            }
            totalTxt.innerText = totalGeral.toFixed(2);
        }

        function finalizarVenda() {
            if (carrinho.length === 0) return alert("Sua sacola está vazia!");

            const dadosPedido = {
                id_usuario: idUsuarioLogado,
                valor_total: totalGeral,
                itens: carrinho.map(item => ({
                    id_produto: item.id_produto,
                    quantidade: 1
                }))
            };

            fetch(`${API}/pedidos`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dadosPedido)
            })
            .then(res => res.json())
            .then(data => {
                if (data.mensagem) {
                    alert(data.mensagem);
                } else if (data.erro) {
                    alert("Erro: " + data.erro);
                } else {
                    alert("Erro inesperado");
                }

                carrinho = [];
                atualizarVisualizacaoSacola();
                listarProdutos();
            });
        }

        function listarPedidosUsuario() {
            const id = document.getElementById("busca_usuario_id").value || idUsuarioLogado;
            fetch(`${API}/usuarios/${id}/pedidos`)
            .then(res => res.json())
            .then(pedidos => {
                const div = document.getElementById("lista_usuario");
                div.innerHTML = pedidos.map(p => 
                    `<p>📦 Pedido #${p.id} - ${p.data} - <b>R$ ${p.total.toFixed(2)}</b> [${p.status}]</p>`
                ).join("");
            });
        }

        function listarPedidosAdmin() {
            fetch(`${API}/admin/pedidos`)
            .then(res => res.json())
            .then(pedidos => {
                const tabela = document.getElementById("tabela_adm");
                tabela.innerHTML = pedidos.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td>${p.data}</td>
                    <td>${p.cliente}</td>
                    <td>R$ ${p.total.toFixed(2)}</td>
                    <td>${p.status}</td>
                    <td>
                        <button onclick="finalizarPedido(${p.id})">
                            Finalizar
                        </button>
                    </td>
                </tr>
            `).join("");
            });
        }

        function finalizarPedido(id) {
    fetch(`${API}/pedidos/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            status: "Finalizado"
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.mensagem || data.erro);
        listarPedidosAdmin(); // atualiza tabela
    });
}
    </script>
</body>
</html>
