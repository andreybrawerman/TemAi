<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TemAí?</title>
    <link rel="stylesheet" href="../../assets/css/globais.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" type="image/png" href="../../assets/img/logo_carrinho_redondo.png">
  </head>
  <body>
    
    {% include "includes/menu.html" %}

    <main class="login-page">
      <div class="container">
        <h2>Entrar no TemAí?</h2>
        <form id="formLogin">
          <div class="form-group">
            <label for="email_login">E-mail</label>
            <input
              type="email"
              id="email_login"
              name="email"
              required
              placeholder="seu@email.com"
            />
          </div>

          <div class="form-group">
            <label for="senha_login">Senha</label>
            <div class="input-container"> 
                <input
                    type="password"
                    id="senha_login"
                    name="senha"
                    required
                    placeholder="Sua senha"
                />
                <button type="button" class="password-toggle" onclick="toggleSenha('senha_login', 'eyeIcon')">
                    <img src="../../assets/img/olho.png" alt="Toggle Password Visibility" id="eyeIcon">
                </button>
            </div>
          </div>

          <button type="submit" class="btn-principal">Entrar</button>

          <div id="mensagemBox" class="mensagem"></div>

          <div class="link-footer">
            Não tem conta? <a href="../cadastro/cadastro.html">Cadastre-se aqui</a>
          </div>
        </form>
      </div>
    </main>

    <script src="login.js"></script>

      <footer>
    Copyright © 2026 TemAí? Inc. Todos os direitos reservados.
    </footer>
  </body>
</html>
