<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TemAí?</title>
    <link rel="stylesheet" href="../../assets/css/globais.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <header>
      <a href="../home/landingpage.html" class="logo">
        <img src="../../assets/img/logo_temai.png" alt="Logo Temai" />
      </a>
      <nav>
        <a href="../home/landingpage.html">Página Inicial</a>
        <a href="../vendas/testar_vendas.html">Área de Compras</a>
        <a href="../estoque/estoque.html">Estoque (ADM)</a>
        <a href="../usuario/usuario.html">Usuários (ADM)</a>
        <a href="../login/login.html" class="ativo">Entrar</a>
        <a href="../cadastro/cadastro.html">Cadastrar</a>
    </nav>
      </nav>
    </header>

    <main class="login-page">
      <div class="container">
        <h2>Entrar no TemAí?</h2>
        <form id="formLogin">
          <div class="form-group">
            <label for="email_login">E-mail</label>
            <input
              type="email"
              id="email_login"
              name="email"
              required
              placeholder="seu@email.com"
            />
          </div>

          <div class="form-group">
            <label for="senha_login">Senha</label>
            <input
              type="password"
              id="senha_login"
              name="senha"
              required
              placeholder="Sua senha"
            />
          </div>

          <button type="submit" class="btn-principal">Entrar</button>

          <div id="mensagemBox" class="mensagem"></div>

          <div class="link-footer">
            Não tem conta? <a href="../cadastro/cadastro.html">Cadastre-se aqui</a>
          </div>
        </form>
      </div>
    </main>

    <script src="login.js"></script>
  </body>
</html>
