<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TemAí?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(14, 90, 64);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgb(2, 67, 44);
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #fffefe; }
        .form-group { margin-bottom: 15px; position: relative; }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #fffefe;
        }
        label.required::after {
            content: " *";
            color: red;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 32px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: rgb(209, 130, 51);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover { background-color: rgb(183, 112, 42); }
        .mensagem { margin-top: 15px; text-align: center; font-weight: bold; }
        .erro { color: red; }
        .sucesso { color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastro</h2>
    <form id="formCadastro">
        
        <div class="form-group">
            <label for="nome" class="required">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Mínimo 5 caracteres" required minlength="5">
        </div>

        <div class="form-group">
            <label for="email" class="required">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="cpf" class="required">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="Apenas números (11 dígitos)" required maxlength="11">
        </div>

        <div class="form-group">
            <label for="data_nascimento" class="required">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>

        <div class="form-group">
            <label for="cep" class="required">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="Apenas números" required maxlength="8">
        </div>

        <div class="form-group">
            <label for="senha" class="required">Senha</label>
            <input type="password" id="senha" name="senha" required>
            <button type="button" class="password-toggle" onclick="toggleSenha('senha')">👁️</button>
        </div>

        <div class="form-group">
            <label for="confirma_senha" class="required">Confirmar Senha</label>
            <input type="password" id="confirma_senha" name="confirma_senha" required>
            <button type="button" class="password-toggle" onclick="toggleSenha('confirma_senha')">👁️</button>
        </div>

        <button type="submit">Cadastrar</button>
        <div id="mensagemBox" class="mensagem"></div>
    </form>
</div>

<script>
    function TestaCPF(strCPF) {
        var Soma = 0;
        var Resto;
        
        strCPF = strCPF.replace(/[^\d]+/g, '');

        if (strCPF == "00000000000" || strCPF.length !== 11) return false;

        for (i=1; i<=9; i++) Soma = Soma + parseInt(strCPF.substring(i-1, i)) * (11 - i);
        Resto = (Soma * 10) % 11;

        if ((Resto == 10) || (Resto == 11))  Resto = 0;
        if (Resto != parseInt(strCPF.substring(9, 10)) ) return false;

        Soma = 0;
        for (i = 1; i <= 10; i++) Soma = Soma + parseInt(strCPF.substring(i-1, i)) * (12 - i);
        Resto = (Soma * 10) % 11;

        if ((Resto == 10) || (Resto == 11))  Resto = 0;
        if (Resto != parseInt(strCPF.substring(10, 11) ) ) return false;
        
        return true; 
    }

    function toggleSenha() {
        const senhaInput = document.getElementById('senha');
        senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('formCadastro').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const msgBox = document.getElementById('mensagemBox');
        const cpfValor = document.getElementById('cpf').value;

        if (!TestaCPF(cpfValor)) {
            msgBox.innerHTML = "CPF Inválido! Por favor, digite um CPF real.";
            msgBox.className = "mensagem erro";
            return;
        }

        msgBox.innerHTML = "Carregando...";
        msgBox.className = "mensagem";

        const data = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            cpf: cpfValor,
            data_nascimento: document.getElementById('data_nascimento').value,
            cep: document.getElementById('cep').value,
            senha: document.getElementById('senha').value,
            confirma_senha: document.getElementById('confirma_senha').value
        };

        try {
            const response = await fetch('http://localhost:5000/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                msgBox.innerHTML = result.mensagem;
                msgBox.className = "mensagem sucesso";
                document.getElementById('formCadastro').reset();
            } else {
                let msgErro = result.erro || (result.erros ? result.erros.join("<br>") : "Erro desconhecido");
                msgBox.innerHTML = msgErro;
                msgBox.className = "mensagem erro";
            }
        } catch (error) {
            msgBox.innerHTML = "Erro ao conectar com o servidor Flask.";
            msgBox.className = "mensagem erro";
        }
    });
</script>

</body>
</html>
